<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor Remote Lite</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<style>
:root {
  --erp-primary: #007aff; --erp-primary-hover: #1677ff; --erp-border: #d9d9d9; --erp-border-light: #f0f0f0;
  --erp-text: rgba(0,0,0,.88); --erp-text-secondary: rgba(0,0,0,.45); --erp-text-muted: #697386;
  --erp-success: #34c759; --erp-danger: #ff4d4f; --erp-radius: 8px; --erp-radius-sm: 6px;
  --erp-shadow: 0 6px 16px rgba(0,0,0,.08), 0 3px 6px -4px rgba(0,0,0,.12), 0 9px 28px 8px rgba(0,0,0,.05);
  --erp-focus: rgba(5,145,255,.1);
  font: 14px/22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--erp-text); background: #f5f5f5;
}
* { box-sizing: border-box; }
body { margin: 0; }
.page { padding: 20px 24px 28px; max-width: 560px; margin: 0 auto; }
.head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
h1 { margin: 0; font-size: 16px; font-weight: 600; line-height: 24px; }
.desc { margin: 0; font-size: 12px; color: var(--erp-text-secondary); }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--erp-border); border-radius: 999px; background: #fff; font-size: 12px; }
.badge i { width: 8px; height: 8px; border-radius: 50%; background: #bbb; }
.badge.ok { color: #135200; border-color: #b7eb8f; background: #f6ffed; }
.badge.ok i { background: var(--erp-success); }
.badge.warn { color: #ad6800; border-color: #ffe58f; background: #fffbe6; }
.badge.warn i { background: #faad14; }
.badge.off i { background: var(--erp-danger); }
.card { background: #fff; border: 1px solid var(--erp-border-light); border-radius: var(--erp-radius); box-shadow: var(--erp-shadow); }
.block { padding: 12px 0; margin: 0 24px; border-bottom: 1px solid var(--erp-border-light); }
.block.last { border-bottom: 0; }
.t { font-size: 14px; font-weight: 500; }
.s { font-size: 12px; color: var(--erp-text-muted); margin-top: 2px; }
.fields { padding-left: 12px; margin-top: 8px; }
label { display: flex; flex-direction: column; gap: 8px; }
input { height: 32px; padding: 4px 11px; border: 1px solid var(--erp-border); border-radius: var(--erp-radius-sm); font: inherit; width: 100%; }
input:focus { outline: none; border-color: var(--erp-primary-hover); box-shadow: 0 0 0 2px var(--erp-focus); }
.foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
button { height: 32px; padding: 0 15px; border-radius: var(--erp-radius-sm); font-size: 14px; border: 1px solid var(--erp-border); background: #fff; cursor: pointer; }
button:disabled { opacity: .45; }
button.ghost:hover:not(:disabled) { color: var(--erp-primary-hover); border-color: var(--erp-primary-hover); }
button.primary { background: var(--erp-primary); border-color: var(--erp-primary); color: #fff; }
.pair { padding-left: 12px; margin-top: 8px; }
.pair img { width: 240px; height: 240px; border: 1px solid var(--erp-border-light); border-radius: var(--erp-radius); }
.qr-ph { width: 240px; height: 140px; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--erp-border); border-radius: var(--erp-radius); color: var(--erp-text-secondary); font-size: 12px; }
.link { display: flex; gap: 8px; margin-top: 10px; }
.link code { flex: 1; font-size: 12px; word-break: break-all; background: #fafafa; border: 1px solid var(--erp-border-light); border-radius: 6px; padding: 8px 10px; }
.hint { font-size: 12px; color: var(--erp-text-secondary); margin: 8px 0 0; }
.repo { margin: 12px 0 0; font-size: 12px; color: var(--erp-text-muted); word-break: break-all; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); max-width: min(280px, calc(100vw - 32px)); background: #fff; border: 1px solid var(--erp-border-light); border-radius: var(--erp-radius); padding: 8px 12px; font-size: 13px; box-shadow: var(--erp-shadow); display: none; z-index: 50; }
.toast.show { display: block; }
.toast.error { color: var(--erp-danger); }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div>
      <h1>Cursor Remote Lite</h1>
      <p class="desc">电脑端软件 · iPhone 用 Safari 扫码（添加到主屏幕，不用装 App）</p>
    </div>
    <div id="badge" class="badge off"><i></i><span id="badgeText">读取中…</span></div>
  </header>

  <section class="card">
    <div class="block">
      <div class="t">公网地址（ChmlFrp / 隧道）</div>
      <div class="s">http:// 也可以；配对会打开中继本身</div>
      <div class="fields"><label><span>relayUrl</span><input id="relayUrl" placeholder="http://你的隧道:端口/"></label></div>
      <div class="foot"><button class="ghost" id="saveBtn">保存</button></div>
    </div>
    <div class="block">
      <div class="t">运行状态</div>
      <div class="s" id="meta">…</div>
      <div class="foot">
        <button class="ghost" id="cursorBtn">启动 / 检查 Cursor</button>
        <button class="ghost" id="stopBtn">停止中继</button>
        <button class="primary" id="startBtn">一键启动中继</button>
      </div>
    </div>
    <div class="block last">
      <div class="t">配对 iPhone</div>
      <div class="s">扫码 → Safari → 分享 → 添加到主屏幕</div>
      <div class="pair">
        <div id="qrPh" class="qr-ph">点击下方生成配对码</div>
        <img id="qr" hidden alt="qr">
        <div id="linkRow" class="link" hidden>
          <code id="link"></code>
          <button class="ghost" id="copyBtn">复制</button>
        </div>
        <p id="pairHint" class="hint" hidden></p>
      </div>
      <div class="foot"><button class="primary" id="pairBtn">生成配对二维码</button></div>
    </div>
  </section>
  <p class="repo" id="repo"></p>
</div>
<div id="toast" class="toast"></div>
<script>
const $ = id => document.getElementById(id);
let busy = false;
function toast(msg, err) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (err ? ' error' : '');
  setTimeout(() => el.classList.remove('show'), err ? 3200 : 1800);
}
async function run(fn) {
  if (busy) return;
  busy = true;
  try { toast(await fn()); await refresh(); }
  catch (e) { toast(String(e.message || e), true); }
  finally { busy = false; }
}
async function refresh() {
  const s = await window.cr.getStatus();
  if (!$('relayUrl').value && s.relay_url) $('relayUrl').value = s.relay_url;
  $('repo').textContent = '仓库：' + s.repo_root;
  $('meta').textContent = `监听端口 ${s.port} · Cursor CDP ${s.cdp_ports.length ? s.cdp_ports.map(p => ':' + p).join(' ') : '未检测到'}`;
  const b = $('badge');
  if (s.relay_listening) { b.className = 'badge ok'; $('badgeText').textContent = '中继在线'; }
  else if (s.relay_running) { b.className = 'badge warn'; $('badgeText').textContent = '启动中…'; }
  else { b.className = 'badge off'; $('badgeText').textContent = '中继已停止'; }
}
$('saveBtn').onclick = () => run(() => window.cr.saveRelayUrl($('relayUrl').value.trim()));
$('startBtn').onclick = () => run(() => window.cr.startRelay());
$('stopBtn').onclick = () => run(() => window.cr.stopRelay());
$('cursorBtn').onclick = () => run(() => window.cr.ensureCursor());
$('pairBtn').onclick = () => run(async () => {
  const info = await window.cr.createPairLink();
  $('qrPh').hidden = true;
  $('qr').hidden = false;
  $('linkRow').hidden = false;
  $('pairHint').hidden = false;
  $('link').textContent = info.link;
  $('pairHint').textContent = `${info.minutes} 分钟内有效，只能用一次`;
  $('qr').src = await QRCode.toDataURL(info.link, { width: 240, margin: 1 });
  return `配对码已生成（${info.minutes} 分钟内有效）`;
});
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText($('link').textContent); toast('已复制配对链接'); }
  catch { toast('复制失败', true); }
};
refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
